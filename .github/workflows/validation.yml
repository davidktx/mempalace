name: validation
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Unit tests
        run: uv run --frozen pytest -q -x --ignore=tests/benchmarks
      - name: Functional harness (chroma)
        run: uv run --frozen python validation/run.py functional
        continue-on-error: true   # known F3 gap, see docs/requirements.md
      - name: Functional harness (sqlite_exact)
        run: uv run --frozen python validation/run.py functional
        env:
          VALIDATION_BACKEND: sqlite_exact
      - name: Snyk
        if: ${{ env.SNYK_TOKEN != '' }}
        run: |
          npm install -g snyk
          uv run --frozen python validation/run.py deps --skip-pytest
